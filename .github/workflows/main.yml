name: ChipShop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every uv command fails if uv.lock is out of date, instead of quietly rewriting it
  UV_LOCKED: "1"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Python 3.15 is reported but does not block a merge until the flip in step 13.5
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check
            python: "3.14"
            experimental: false
          - name: Python 3.15
            python: "3.15"
            experimental: true

    steps:
      # Actions are pinned by commit; the comment is the release it was taken from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The version comes from required-version in pyproject.toml; this is its x86_64 Linux release
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check
        # no-commit-to-branch guards local commits; here it would fail every run on main
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files
