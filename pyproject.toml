[project]
name = "chip-shop"
version = "0.0.0"
description = "Fetches public UK datasets and builds versioned tables from them."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "polars==2.0.0", # a new major version, and its output feeds content hashes, so pinned exactly
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty==0.0.87", # still beta, so pinned exactly
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.0"

[tool.uv.build-backend]
module-name = "fryer"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: mark a test that needs external data sources.",
]
addopts = "--cov=fryer --cov-report term-missing"

[tool.ruff.format]
# ruff also formats Python inside Markdown; the plan's code sketches are aligned by hand
exclude = ["PLAN.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter
    "CPY001", # No copyright notice on each file
    "D1", # Names and types are the documentation; a docstring is for why, so it is not required
    "D203", # Incompatible with D211
    "D213", # Incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Want to use asserts
]
